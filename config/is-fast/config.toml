# config/is-fast/config.toml
# Color keys under [display]/[history]/[styles.*] are owned and rewritten by
# scripts/gen-palette — edit config/palettes/<name>.lua instead. Every other
# section here is yours; gen-palette never touches keys outside the ones it
# owns.

[search]
engine = "duckduckgo"

[selectors]
"*en.wikipedia.org*" = "p"
"*github.com*" = ".markdown-body"
"*stackoverflow.com*" = ".s-prose"
"*reddit.com*" = "[data-testid='comment']"

[syntax]
theme = "base16-ocean.dark"

[display]
border_color = "#ffdd33"

[history]
title_color = "#ffdd33"
url_color = "#95a99f"
time_color = "#cc8c3c"
text_color = "#95a99f"

[styles.a]
fg = "#96a6c8"

[styles.img]
fg = "#f43841"
bold = true

[styles.blockquote]
fg = "#52494e"
italic = true

[styles.mark]
fg = "#080808"
bg = "#ffdd33"

[styles.kbd]
fg = "#080808"
bg = "#453d41"

[styles.var]
fg = "#f43841"
italic = true

[styles.samp]
fg = "#9e95c7"

[styles.small]
fg = "#95a99f"

[styles.sub]
fg = "#95a99f"

[styles.sup]
fg = "#95a99f"

[styles.dd]
fg = "#95a99f"
