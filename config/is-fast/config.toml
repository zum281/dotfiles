# config/is-fast/config.toml
# Color keys under [display]/[history]/[styles.*] are owned and rewritten by
# scripts/gen-palette — edit config/palettes/<name>.lua instead. Every other
# section here is yours; gen-palette never touches keys outside the ones it
# owns.

[search]
engine = "duckduckgo"

[selectors]
"*en.wikipedia.org*" = "p"
"*github.com*" = ".markdown-body"
"*stackoverflow.com*" = ".s-prose"
"*reddit.com*" = "[data-testid='comment']"

[syntax]
theme = "base16-ocean.dark"

[display]
border_color = "#e0b341"

[history]
title_color = "#e0b341"
url_color = "#948a7d"
time_color = "#cf9163"
text_color = "#7fa99b"

[styles.a]
fg = "#8ba0bd"

[styles.img]
fg = "#c77b6b"
bold = true

[styles.blockquote]
fg = "#6f655a"
italic = true

[styles.mark]
fg = "#000000"
bg = "#e0b341"

[styles.kbd]
fg = "#000000"
bg = "#2a2521"

[styles.var]
fg = "#c77b6b"
italic = true

[styles.samp]
fg = "#b58cb0"

[styles.small]
fg = "#948a7d"

[styles.sub]
fg = "#948a7d"

[styles.sup]
fg = "#948a7d"

[styles.dd]
fg = "#948a7d"
