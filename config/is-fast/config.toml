# config/is-fast/config.toml
# Color keys under [display]/[history]/[styles.*] are owned and rewritten by
# scripts/gen-palette — edit config/palettes/<name>.lua instead. Every other
# section here is yours; gen-palette never touches keys outside the ones it
# owns.

[search]
engine = "duckduckgo"

[selectors]
"*en.wikipedia.org*" = "p"
"*github.com*" = ".markdown-body"
"*stackoverflow.com*" = ".s-prose"
"*reddit.com*" = "[data-testid='comment']"

[syntax]
theme = "base16-ocean.dark"

[display]
border_color = "#efd45b"

[history]
title_color = "#efd45b"
url_color = "#8c8c8c"
time_color = "#cc8c3c"
text_color = "#96a29c"

[styles.a]
fg = "#9fb2d6"

[styles.img]
fg = "#d64c4b"
bold = true

[styles.blockquote]
fg = "#6e6a64"
italic = true

[styles.mark]
fg = "#000000"
bg = "#efd45b"

[styles.kbd]
fg = "#000000"
bg = "#484848"

[styles.var]
fg = "#d64c4b"
italic = true

[styles.samp]
fg = "#9e95c7"

[styles.small]
fg = "#8c8c8c"

[styles.sub]
fg = "#8c8c8c"

[styles.sup]
fg = "#8c8c8c"

[styles.dd]
fg = "#8c8c8c"
